# nginx — salin ke /etc/nginx/sites-available/scan-wisuda
# Tanpa domain: diakses lewat http://IP-VPS. Kalau nanti punya domain,
# ganti "server_name _;" dengan nama domain lalu jalankan certbot (DEPLOY.md).
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    client_max_body_size 10m;   # upload Excel

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        # Wajib untuk Socket.IO (WebSocket)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
